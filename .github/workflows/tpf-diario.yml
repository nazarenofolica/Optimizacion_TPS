# TPF: ETL diario. Baja los precios del último día de SEPA, rearma la base (python -m sepa --diario), exporta la
# página de la canasta (python -m canasta --exportar, sin clave de rutas) y la publica en Cloudflare Pages:
#   https://changuito-sano.pages.dev/
#
# - Corre en un runner propio, en una PC en Argentina (etiqueta "canasta"): la API de SEPA (datos.produccion.gob.ar)
#   bloquea las IPs de los runners de GitHub con un 403. Si la PC está apagada, la corrida espera en cola hasta que
#   el runner se conecte (GitHub la cancela a las 24 h).
# - No commitea nada: la base del día vive en la carpeta del runner y en el sitio publicado (no hay historial de precios).
# - Si SEPA no publicó un día nuevo desde el que ya está en el sitio, termina bien, sin rearmar ni publicar.
# - Si la API de SEPA rechaza al runner (403), también termina bien, con un aviso, sin publicar y sin tocar el issue.
# - Si falla algo (una fuente, la verificación de sepa/verificacion.py, la exportación), el job falla y queda
#   publicada la página anterior. GitHub avisa por mail y se abre (o se comenta) un issue.
# - Las fuentes que no cambian a diario (Open Food Facts, catálogos web, Georef/USIG, USDA) quedan en el disco del
#   runner entre corridas (base_sepa/datos/, ignorada por git): el checkout no limpia los archivos ignorados.
# Detalle y activación: TPF/docs/DESPLIEGUE.md.

name: "TPF · ETL diario y página"

on:
  schedule:
    # En UTC (Argentina = UTC-3). SEPA sube el ZIP de cada día a la API recién a la tarde de ese día.
    - cron: "30 10 * * *"   # 07:30 en Argentina: toma el último ZIP publicado (si no estaba ya en el sitio)
    - cron: "0 21 * * *"    # 18:00 en Argentina: el ZIP de ese mismo día, ya publicado
  workflow_dispatch:
    inputs:
      forzar:
        description: "Rearmar y publicar aunque el sitio ya tenga el último día de SEPA"
        type: boolean
        default: false
      actualizar_web:
        description: "Volver a recorrer los catálogos de Jumbo, Disco y Vea (tarda mucho más)"
        type: boolean
        default: false

permissions:
  contents: read

# Una sola corrida a la vez (la de la mañana, la de la tarde o una manual); la que llega espera, no cancela.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  CACHE_DIR: TPF/base_sepa/datos/cache
  SITIO: https://changuito-sano.pages.dev
  PROYECTO: changuito-sano
  CLOUDFLARE_ACCOUNT_ID: a6105ca1986f2a074fb884207521edae
  WRANGLER: wrangler@4.159.0

jobs:
  etl:
    name: Base del día y página
    runs-on: [self-hosted, canasta]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
        working-directory: TPF/base_sepa
    outputs:
      nuevo: ${{ steps.fecha.outputs.nuevo }}
      bloqueado: ${{ steps.fecha.outputs.bloqueado }}
      fecha: ${{ steps.dia.outputs.fecha }}
    steps:
      # clean: false deja los archivos ignorados por git (base_sepa/datos/: cachés y ZIP; base_sepa/.venv/).
      - uses: actions/checkout@v4
        with:
          clean: false

      # Un entorno virtual propio del runner, con Python 3.10 (la versión del equipo), que queda entre corridas.
      - name: Python y dependencias
        run: |
          if [ ! -x .venv/Scripts/python.exe ]; then python -m venv .venv; fi
          .venv/Scripts/python.exe --version
          .venv/Scripts/python.exe -c "import sys; assert sys.version_info[:2] == (3, 10), 'El runner necesita Python 3.10'"
          .venv/Scripts/python.exe -m pip install -q --disable-pip-version-check -r requirements.txt
          cygpath -w "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          echo "LOG=$(cygpath -u "$RUNNER_TEMP")/sepa.log" >> "$GITHUB_ENV"

      - name: ¿Hay un día nuevo en SEPA?
        id: fecha
        env:
          FORZAR: ${{ inputs.forzar }}
        run: |
          salida=$(python -m sepa --ultima-fecha 2>&1) || true
          disponible=$(printf '%s\n' "$salida" | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | tail -n 1 || true)
          if [ -z "$disponible" ]; then
            # Si la API de SEPA rechaza al runner (403), no es una falla del pipeline: la corrida termina bien, sin
            # publicar, y la página sigue con el último día bueno.
            if printf '%s\n' "$salida" | grep -q '403 Client Error'; then
              echo "::warning::La API de SEPA rechazó al runner (403). No se rearma ni se publica: la página sigue con los precios anteriores."
              echo "### SEPA bloqueó al runner (403): no se publicó, la página sigue con los precios anteriores" >> "$GITHUB_STEP_SUMMARY"
              echo "nuevo=false" >> "$GITHUB_OUTPUT"
              echo "bloqueado=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Cualquier otra respuesta (caída, formato nuevo, sin ZIPs) es un error real: el job falla.
            printf '%s\n' "$salida" | tail -n 20
            echo "::error::La API de SEPA no informó la fecha del último ZIP."
            exit 1
          fi
          # La fecha que está publicada (fecha.txt del sitio); vacía la primera vez.
          publicada=$(curl -fsSL --max-time 30 "$SITIO/fecha.txt" 2>/dev/null | tr -d '[:space:]' || true)
          if ! [[ "$publicada" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then publicada=""; fi
          echo "Último ZIP de SEPA: $disponible · publicado en el sitio: ${publicada:-ninguno}"
          if [ "$FORZAR" != "true" ] && [ -n "$publicada" ] && ! [[ "$disponible" > "$publicada" ]]; then
            echo "::notice::Sin novedades: el sitio ya tiene los precios del $publicada (último ZIP de SEPA: $disponible). No se rearma ni se publica."
            echo "### Sin novedades: el sitio ya tiene los precios del $publicada" >> "$GITHUB_STEP_SUMMARY"
            echo "nuevo=false" >> "$GITHUB_OUTPUT"
          else
            echo "nuevo=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Armar la base (python -m sepa --diario)
        if: steps.fecha.outputs.nuevo == 'true'
        id: sepa
        env:
          ACTUALIZAR_WEB: ${{ inputs.actualizar_web }}
        run: |
          df -h . | tail -n 1
          argumentos=(--diario)
          if [ "$ACTUALIZAR_WEB" = "true" ]; then argumentos+=(--actualizar-web); fi
          python -m sepa "${argumentos[@]}" 2>&1 | tee "$LOG"
          du -sh datos/cache/* datos/entrada 2>/dev/null || true

      - name: Motivo de la falla
        if: failure() && steps.sepa.outcome == 'failure'
        run: |
          touch "$LOG"
          {
            echo "## No se publicó: falló el armado de la base"
            if grep -q "controles críticos que fallan" "$LOG"; then
              echo "Falló la **verificación** (\`sepa/verificacion.py\`). La página publicada sigue siendo la anterior."
              echo "Las tablas de esta corrida quedan en el artefacto \`corrida-fallida\`."
            else
              echo "Falló una fuente o un paso del pipeline. La página publicada sigue siendo la anterior."
            fi
            echo '```'
            grep -E "\[ERROR\]|Error|Traceback" "$LOG" | tail -n 40 || true
            tail -n 15 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar las tablas de la corrida fallida
        if: failure() && steps.sepa.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: corrida-fallida
          path: ${{ env.CACHE_DIR }}/corrida_fallida/
          retention-days: 7
          if-no-files-found: ignore

      - name: Fecha de los precios
        if: steps.fecha.outputs.nuevo == 'true'
        id: dia
        run: |
          zip=$(ls datos/entrada/sepa_*.zip | tail -n 1)
          fecha=$(basename "$zip" .zip)
          fecha=${fecha#sepa_}
          echo "fecha=$fecha" >> "$GITHUB_OUTPUT"
          {
            echo "### Precios de SEPA del $fecha"
            grep -E "Listo en|Verificación:" "$LOG" | sed 's/^/- /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Exportar la página (python -m canasta --exportar)
        if: steps.fecha.outputs.nuevo == 'true'
        run: |
          python -m canasta --exportar
          # La página publicada nunca lleva la clave de rutas (el runner no tiene .env; esto lo confirma).
          if ! grep -qF '<script id="config-rutas" type="application/json">{"clave": ""}</script>' ../datos/sepa/canasta.html; then
            echo "::error::La página exportada lleva una clave de rutas: no se publica."
            exit 1
          fi

      # El sitio: la página es un único HTML autosuficiente, así que va directo como index.html (la URL del sitio
      # abre la canasta, sin redirección, y los enlaces con ?perfiles=...&lat=... funcionan en la raíz). También como
      # canasta.html, el nombre que usan la presentación y la documentación. fecha.txt dice qué día está publicado.
      - name: Armar el sitio
        if: steps.fecha.outputs.nuevo == 'true'
        env:
          FECHA: ${{ steps.dia.outputs.fecha }}
        run: |
          sitio=../../_site
          rm -rf "$sitio"
          mkdir -p "$sitio"
          cp ../datos/sepa/canasta.html "$sitio/index.html"
          cp ../datos/sepa/canasta.html "$sitio/canasta.html"
          printf '%s\n' "$FECHA" > "$sitio/fecha.txt"
          ls -la "$sitio"

      - name: Publicar en Cloudflare Pages
        if: steps.fecha.outputs.nuevo == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes "$WRANGLER" pages deploy ../../_site --project-name "$PROYECTO" --branch main --commit-dirty=true
          echo "### Publicado en $SITIO" >> "$GITHUB_STEP_SUMMARY"

  avisos:
    name: Aviso por issue
    needs: etl
    # Solo en la rama principal (la del cron): una prueba en otra rama no abre issues.
    if: always() && (github.event_name == 'schedule' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # Un solo issue abierto por vez: si ya hay uno, se comenta; cuando vuelve a andar, se cierra.
      - name: Abrir, comentar o cerrar el issue
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          ETL: ${{ needs.etl.result }}
          BLOQUEADO: ${{ needs.etl.outputs.bloqueado }}
        with:
          script: |
            // SEPA bloqueó al runner: no falló nada, pero tampoco "volvió a andar". No se abre ni se cierra el issue.
            if (process.env.BLOQUEADO === "true") return;
            const titulo = "ETL diario de la canasta: falló la corrida";
            const corrida = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const fallo = process.env.ETL === "failure";
            const { data } = await github.rest.issues.listForRepo({ ...context.repo, state: "open", per_page: 100 });
            const abierto = data.find((i) => i.title === titulo && !i.pull_request);
            if (fallo && abierto) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: abierto.number,
                body: `Volvió a fallar: ${corrida}` });
            } else if (fallo) {
              await github.rest.issues.create({ ...context.repo, title: titulo,
                body: `La corrida ${corrida} falló y no se publicó: la página sigue con los precios del último día ` +
                      `que pasó la verificación.\n\nEl resumen de la corrida dice en qué paso falló. Ver ` +
                      `TPF/docs/DESPLIEGUE.md. Este issue se cierra solo cuando una corrida vuelve a andar.` });
            } else if (process.env.ETL === "success" && abierto) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: abierto.number,
                body: `Volvió a andar: ${corrida}` });
              await github.rest.issues.update({ ...context.repo, issue_number: abierto.number, state: "closed" });
            }
