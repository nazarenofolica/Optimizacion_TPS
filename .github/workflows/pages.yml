# Respaldo manual: publica la canasta versionada (TPF/datos/sepa/canasta.html, sin clave, con la base del repo) en
#   https://changuito-sano.pages.dev/  (Cloudflare Pages, proyecto "changuito-sano")
# La publicación de todos los días la hace tpf-diario.yml, con los precios del día. Este workflow corre solo a mano
# (Actions → "Demo en Cloudflare Pages" → Run workflow), para volver a la página del repo si el diario no puede publicar.
# Si corriera en cada push, pisaría la página del día con la del repo. No publica fecha.txt: la corrida siguiente del
# diario rearma y publica la del día.
# La primera corrida crea el proyecto en Cloudflare. Secretos del repo: CLOUDFLARE_API_TOKEN (permiso
# "Cloudflare Pages: Edit") y CLOUDFLARE_ACCOUNT_ID.
name: Demo en Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PROYECTO: changuito-sano
  WRANGLER: wrangler@4.159.0

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: cloudflare-pages
      url: https://changuito-sano.pages.dev/
    steps:
      - uses: actions/checkout@v4

      - name: Armar el sitio
        run: |
          # La página publicada nunca lleva la clave de rutas.
          if ! grep -qF '<script id="config-rutas" type="application/json">{"clave": ""}</script>' TPF/datos/sepa/canasta.html; then
            echo "::error::La página versionada lleva una clave de rutas: no se publica."
            exit 1
          fi
          mkdir -p _site
          cp TPF/datos/sepa/canasta.html _site/index.html
          cp TPF/datos/sepa/canasta.html _site/canasta.html

      - name: Publicar en Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # El Account ID son 32 caracteres hexadecimales. Un espacio, salto de línea o carácter invisible pegado con el
          # secreto hace que wrangler lo rechace: se deja solo lo hexadecimal, en minúscula. Si no quedan 32, se dice
          # qué tiene sin mostrarlo.
          crudo="$CLOUDFLARE_ACCOUNT_ID"
          CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$crudo" | LC_ALL=C tr -cd '0-9a-fA-F' | tr 'A-F' 'a-f')
          # Si el secreto falta o no es un Account ID, se lo pide a Cloudflare: la cuenta a la que tiene acceso el token.
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::warning::CLOUDFLARE_ACCOUNT_ID no es un Account ID (32 caracteres hexadecimales): se toma la cuenta del token."
            cuentas=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts" | jq -r '.result[].id')
            if [ "$(printf '%s\n' "$cuentas" | grep -c .)" != "1" ]; then
              echo "::error::El token no tiene acceso a exactamente una cuenta: cargar el Account ID con gh secret set CLOUDFLARE_ACCOUNT_ID"
              exit 1
            fi
            CLOUDFLARE_ACCOUNT_ID="$cuentas"
            echo "::add-mask::$CLOUDFLARE_ACCOUNT_ID"
          fi
          export CLOUDFLARE_ACCOUNT_ID
          # Crea el proyecto si todavía no existe (la primera vez).
          if ! npx --yes "$WRANGLER" pages project list | grep -qw "$PROYECTO"; then
            npx --yes "$WRANGLER" pages project create "$PROYECTO" --production-branch main
          fi
          npx --yes "$WRANGLER" pages deploy _site --project-name "$PROYECTO" --branch main --commit-dirty=true
