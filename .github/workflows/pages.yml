# Respaldo manual: publica la canasta versionada (TPF/datos/sepa/canasta.html, sin clave, con la base del repo) en
#   https://nazarenofolica.github.io/Optimizacion_TPS/
# La publicación de todos los días la hace tpf-diario.yml, con los precios del día. Este workflow corre solo a mano
# (Actions → "Demo en GitHub Pages" → Run workflow), para volver a la página del repo si el diario no puede publicar.
# Si corriera en cada push, pisaría la página del día con la del repo. No publica fecha.txt: la corrida siguiente del
# diario rearma y publica la del día.
name: Demo en GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio
        run: |
          mkdir -p _site
          cp TPF/datos/sepa/canasta.html _site/index.html
          cp TPF/datos/sepa/canasta.html _site/canasta.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
