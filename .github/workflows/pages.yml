# Publica la demo de la canasta (TPF/datos/sepa/canasta.html, la versión sin clave) en GitHub Pages:
#   https://nazarenofolica.github.io/Optimizacion_TPS/
# Requiere, una sola vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Demo en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "TPF/datos/sepa/canasta.html"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Armar el sitio
        run: |
          mkdir -p _site
          cp TPF/datos/sepa/canasta.html _site/index.html
          cp TPF/datos/sepa/canasta.html _site/canasta.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
